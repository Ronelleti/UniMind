apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: unimind-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:Ronelleti/UniMind.git

    targetRevision: develop

    path: helm/unimind

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc

    namespace: unimind-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
